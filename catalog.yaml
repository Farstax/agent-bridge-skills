schemaVersion: farstax.agent-bridge.skill-pack-catalog/v1alpha1
description: >
  Index of curated Skill Packs published by this repository. Farstax/agent-bridge
  reads this file to discover packs; Farstax Stacks may reference pack ids for
  recommendation without duplicating pack content. See AGENTS.md for the
  curation contract and Farstax/agent-bridge#703 for the pack mechanism this
  catalogue is meant to feed.
packs:
  - id: marketing
    path: packs/marketing/pack.yaml
