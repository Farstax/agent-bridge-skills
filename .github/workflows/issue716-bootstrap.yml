name: Regenerate issue 716 catalogue

on:
  push:
    branches:
      - fix/716-marketing-min-agent-bridge-version

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/716-marketing-min-agent-bridge-version
          fetch-depth: 0
      - name: Regenerate and publish canonical catalogue
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue716-bootstrap.yml
          git commit -m "chore: remove temporary catalogue bootstrap"
          revision="$(git rev-parse HEAD)"
          node scripts/build-catalogue.mjs --revision "$revision"
          git add catalogue.json
          git commit -m "Publish catalogue pinned to ${revision}"
          git push origin HEAD:fix/716-marketing-min-agent-bridge-version
