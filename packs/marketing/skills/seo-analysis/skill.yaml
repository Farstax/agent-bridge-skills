schemaVersion: farstax.agent-bridge.skill/v1alpha1

id: seo-analysis
name: SEO Analysis
description: Full technical and content SEO audit using live Search Console and page-performance data.

origin:
  type: adapted-upstream
  upstream:
    repository: https://github.com/nowork-studio/notfair-plugin
    path: seo/seo-analysis
    commit: daf87d3d4c985fa34ff7843aa570bc8c0d656ec2
    license: MIT
  modified: true
  importedAt: "2026-09-06"
  lastUpstreamReview: "2026-09-06"

attribution:
  notice: ../../NOTICE.md

hosts:
  - claude
  - codex
  - generic-agent-skills

capabilities:
  - seo-analysis

dependencies:
  local: []
  externalServices:
    - id: google-search-console
      required: false
      purpose: Live Search Console performance and indexing data for the audited property.
      authorization: oauth
    - id: google-pagespeed-insights
      required: false
      purpose: Core Web Vitals and page-speed signals.
      authorization: api-key
  mcp:
    - id: notfair
      required: false
      purpose: Optional hosted connector for Search Console/PageSpeed access instead of a direct API credential.
      hosted: true

secrets: []

effects:
  level: external-read
  externalWrite: false
  financialSpend: false

approvals: []

evals:
  - evals/eval-1.md
